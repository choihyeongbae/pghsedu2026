<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학과 탐색기 — 대학알리미 교육과정 키워드 분석</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js"></script>
<script src="data.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14; --surface: #161a24; --surface2: #1e2433; --border: #2a3045;
    --accent: #4f8ef7; --accent3: #f75a8e; --text: #e8ecf5;
    --text-muted: #7a8299; --text-dim: #4a5068;
    --success: #3dd68c; --warn: #f7a94f;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: linear-gradient(rgba(79,142,247,.03) 1px,transparent 1px), linear-gradient(90deg,rgba(79,142,247,.03) 1px,transparent 1px);
    background-size:40px 40px;
  }
  header {
    position:relative; z-index:10; padding:18px 36px;
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:18px;
    background:rgba(13,15,20,.95); backdrop-filter:blur(12px);
  }
  .badge {
    font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--accent);
    background:rgba(79,142,247,.1); border:1px solid rgba(79,142,247,.3); padding:4px 10px; border-radius:4px; white-space:nowrap;
  }
  header h1 { font-size:17px; font-weight:700; }
  header h1 span { color:var(--text-muted); font-weight:300; }
  .hdr-right { margin-left:auto; font-family:'DM Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap; }

  .layout { position:relative; z-index:1; display:grid; grid-template-columns:290px 1fr; height:calc(100vh - 61px); }

  /* sidebar */
  .sidebar { border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--surface); overflow:hidden; }
  .search-sec { padding:18px; border-bottom:1px solid var(--border); }
  .s-label { font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; font-family:'DM Mono',monospace; margin-bottom:9px; display:block; }
  .s-wrap { position:relative; }
  .s-wrap input {
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:9px 13px 9px 34px; color:var(--text); font-family:'Noto Sans KR',sans-serif; font-size:13px; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .s-wrap input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,142,247,.12); }
  .s-wrap input::placeholder { color:var(--text-dim); }
  .s-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:13px; }
  .cmp-hint { padding:7px 18px; font-size:10px; color:var(--text-dim); font-family:'DM Mono',monospace; border-bottom:1px solid var(--border); background:rgba(79,142,247,.03); }
  .dept-list { flex:1; overflow-y:auto; padding:5px 0; }
  .dept-list::-webkit-scrollbar { width:3px; }
  .dept-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .dept-item {
    padding:8px 18px; font-size:13px; color:var(--text-muted); cursor:pointer;
    display:flex; align-items:center; border-left:2px solid transparent; transition:all .12s; user-select:none;
  }
  .dept-item:hover { background:rgba(79,142,247,.07); color:var(--text); border-left-color:rgba(79,142,247,.3); }
  .dept-item.active { background:rgba(79,142,247,.12); color:var(--accent); border-left-color:var(--accent); font-weight:500; }
  .dept-item.cmp-sel { background:rgba(247,90,142,.1); color:var(--accent3); border-left-color:var(--accent3); }
  .d-cnt { margin-left:auto; font-family:'DM Mono',monospace; font-size:10px; color:var(--text-dim); }
  .no-res { padding:24px 18px; text-align:center; color:var(--text-dim); font-size:13px; }

  /* right */
  .right { display:flex; flex-direction:column; overflow:hidden; }
  .info-bar { padding:12px 28px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; background:rgba(22,26,36,.7); flex-shrink:0; }
  .d-title { font-size:15px; font-weight:700; }
  .d-meta { font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; }
  .tab-g { margin-left:auto; display:flex; gap:2px; background:var(--surface2); border-radius:8px; padding:3px; }
  .tab-btn { padding:5px 13px; border:none; background:transparent; color:var(--text-muted); font-family:'Noto Sans KR',sans-serif; font-size:12px; cursor:pointer; border-radius:6px; transition:all .15s; white-space:nowrap; }
  .tab-btn.active { background:var(--accent); color:#fff; font-weight:500; }

  .main-view { flex:1; display:grid; grid-template-columns:1fr 350px; overflow:hidden; }
  .cloud-wrap { display:flex; align-items:center; justify-content:center; padding:14px; position:relative; overflow:hidden; }
  #wc-svg { width:100%; height:100%; }
  .cloud-hint { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--text-dim); font-family:'DM Mono',monospace; pointer-events:none; white-space:nowrap; }

  .detail-panel { border-left:1px solid var(--border); background:var(--surface); overflow-y:auto; display:flex; flex-direction:column; }
  .detail-panel::-webkit-scrollbar { width:3px; }
  .detail-panel::-webkit-scrollbar-thumb { background:var(--border); }
  .det-hdr { padding:16px 18px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:5; }
  .det-kw { font-size:20px; font-weight:700; color:var(--accent); margin-bottom:2px; }
  .det-sub { font-size:10px; color:var(--text-dim); font-family:'DM Mono',monospace; }
  .course-card { margin:9px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:13px; transition:border-color .2s; animation:fadeUp .25s ease; }
  .course-card:hover { border-color:rgba(79,142,247,.35); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .c-name { font-size:12px; font-weight:600; color:var(--text); margin-bottom:5px; line-height:1.4; }
  .c-desc { font-size:11px; color:var(--text-muted); line-height:1.7; }
  .no-courses { padding:28px 18px; text-align:center; color:var(--text-dim); font-size:12px; }

  /* rank */
  .rank-view { flex:1; overflow-y:auto; padding:18px 28px; }
  .rank-view::-webkit-scrollbar { width:3px; }
  .rank-view::-webkit-scrollbar-thumb { background:var(--border); }
  .rank-item { display:flex; align-items:center; gap:12px; padding:7px 5px; border-bottom:1px solid rgba(42,48,69,.5); cursor:pointer; border-radius:6px; transition:background .12s; }
  .rank-item:hover { background:rgba(79,142,247,.05); }
  .r-num { font-family:'DM Mono',monospace; font-size:11px; color:var(--text-dim); width:18px; text-align:right; }
  .r-word { font-size:13px; font-weight:500; min-width:70px; }
  .r-bar-w { flex:1; height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  .r-bar { height:100%; border-radius:3px; transition:width .5s cubic-bezier(.4,0,.2,1); }
  .r-score { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-dim); width:42px; text-align:right; }

  /* landing */
  .landing { grid-column:1/3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-dim); }
  .l-icon { font-size:42px; opacity:.3; }
  .l-text { font-size:14px; } .l-sub { font-size:11px; opacity:.6; }

  /* compare banner */
  .cmp-banner { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--accent); border-radius:12px; padding:9px 16px; display:none; align-items:center; gap:12px; z-index:100; box-shadow:0 8px 32px rgba(0,0,0,.5); }
  .cmp-banner.show { display:flex; }
  .cmp-tag { background:rgba(79,142,247,.15); border:1px solid rgba(79,142,247,.3); border-radius:6px; padding:3px 9px; font-size:12px; color:var(--accent); }
  .cmp-vs { font-size:11px; color:var(--text-dim); }
  .cmp-go { padding:6px 16px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-family:'Noto Sans KR',sans-serif; font-size:12px; font-weight:500; cursor:pointer; transition:opacity .2s; }
  .cmp-go:hover { opacity:.85; }
  .cmp-x { color:var(--text-dim); font-size:15px; cursor:pointer; background:none; border:none; }

  /* modal */
  .modal-ov { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:200; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal-ov.show { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; width:90vw; max-width:840px; max-height:85vh; overflow-y:auto; padding:26px; }
  .modal::-webkit-scrollbar { width:3px; } .modal::-webkit-scrollbar-thumb { background:var(--border); }
  .modal-title { font-size:16px; font-weight:700; margin-bottom:18px; }
  .cmp-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .cmp-col-title { font-size:13px; font-weight:700; margin-bottom:10px; padding-bottom:7px; border-bottom:1px solid var(--border); }
  .sec-label { font-size:10px; letter-spacing:2px; color:var(--text-dim); font-family:'DM Mono',monospace; text-transform:uppercase; margin:12px 0 6px; }
  .kw-chip { display:inline-block; padding:3px 8px; border-radius:20px; font-size:11px; margin:2px; font-weight:500; }
  .kw-c { background:rgba(61,214,140,.15); color:var(--success); border:1px solid rgba(61,214,140,.25); }
  .kw-a { background:rgba(79,142,247,.15); color:var(--accent); border:1px solid rgba(79,142,247,.25); }
  .kw-b { background:rgba(247,90,142,.15); color:var(--accent3); border:1px solid rgba(247,90,142,.25); }
  .big-n { font-size:26px; font-weight:900; }
  .big-u { font-size:12px; color:var(--text-dim); }
  .modal-close { margin-top:18px; width:100%; padding:10px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text-muted); font-family:'Noto Sans KR',sans-serif; font-size:13px; cursor:pointer; transition:all .15s; }
  .modal-close:hover { border-color:var(--accent); color:var(--text); }
</style>
</head>
<body>

<header>
  <div class="badge">대학알리미 공공데이터</div>
  <h1>학과 탐색기 <span>— 교육과정 키워드 분석</span></h1>
  <div class="hdr-right" id="hdr-cnt">로딩 중…</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="search-sec">
      <span class="s-label">학과 검색</span>
      <div class="s-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="s-input" placeholder="데이터, 컴퓨터, AI, 간호…" autocomplete="off"/>
      </div>
    </div>
    <div class="cmp-hint">💡 Shift+클릭 → 2개 선택 → 비교 분석</div>
    <div class="dept-list" id="dept-list"></div>
  </aside>

  <div class="right" id="right">
    <div class="info-bar" id="info-bar" style="display:none;">
      <div>
        <div class="d-title" id="d-title"></div>
        <div class="d-meta" id="d-meta"></div>
      </div>
      <div class="tab-g">
        <button class="tab-btn active" id="tb-cloud" onclick="switchTab('cloud')">☁ 워드클라우드</button>
        <button class="tab-btn" id="tb-rank" onclick="switchTab('rank')">📊 키워드 순위</button>
      </div>
    </div>
    <div class="main-view" id="main-view">
      <div class="landing">
        <div class="l-icon">🎓</div>
        <p class="l-text">왼쪽에서 학과를 선택하세요</p>
        <p class="l-sub">TF-IDF 기반 교육과정 핵심 키워드를 시각화합니다</p>
      </div>
    </div>
    <div class="rank-view" id="rank-view" style="display:none;"></div>
  </div>
</div>

<div class="cmp-banner" id="cmp-banner">
  <div id="cmp-tags"></div>
  <button class="cmp-go" onclick="openCompare()">비교 분석 →</button>
  <button class="cmp-x" onclick="clearCompare()">✕</button>
</div>

<div class="modal-ov" id="modal-ov" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal">
    <div class="modal-title">⚖️ 학과 비교 분석</div>
    <div class="cmp-grid" id="cmp-grid"></div>
    <div id="cmp-common"></div>
    <button class="modal-close" onclick="document.getElementById('modal-ov').classList.remove('show')">닫기</button>
  </div>
</div>

<script>
const COLORS=['#4f8ef7','#f75a8e','#3dd68c','#f7a94f','#7c5af7','#5af7f7','#f7e94f','#a78bfa','#34d399','#fb923c'];
let curDept=null, curTab='cloud', cmpList=[];

function init(){
  document.getElementById('hdr-cnt').textContent=`${DEPT_LIST_DATA.length}개 학과`;
  renderList(DEPT_LIST_DATA);
}

function renderList(list){
  const el=document.getElementById('dept-list');
  if(!list.length){el.innerHTML='<div class="no-res">검색 결과가 없습니다</div>';return;}
  el.innerHTML=list.map(n=>{
    const d=DEPT_KEYWORDS[n];
    return `<div class="dept-item${n===curDept?' active':''}${cmpList.includes(n)?' cmp-sel':''}"
      onclick="handleClick(event,'${n.replace(/'/g,"\\'")}')">
      <span style="flex:1">${n}</span>
      ${d?`<span class="d-cnt">${d.cnt}</span>`:''}
    </div>`;
  }).join('');
}

document.getElementById('s-input').addEventListener('input',e=>{
  const q=e.target.value.trim();
  renderList(q?DEPT_LIST_DATA.filter(n=>n.includes(q)):DEPT_LIST_DATA);
});

function handleClick(e,n){
  if(e.shiftKey){toggleCmp(n);return;}
  selectDept(n);
}

function selectDept(n){
  curDept=n;
  const d=DEPT_KEYWORDS[n]; if(!d)return;
  document.getElementById('info-bar').style.display='flex';
  document.getElementById('d-title').textContent=n;
  document.getElementById('d-meta').textContent=`핵심 키워드 ${Object.keys(d.t).length}개 · 교과목 ${d.cnt}개`;
  switchTab('cloud',d);
  const q=document.getElementById('s-input').value.trim();
  renderList(q?DEPT_LIST_DATA.filter(n=>n.includes(q)):DEPT_LIST_DATA);
}

function switchTab(tab,dData){
  curTab=tab;
  const d=dData||(curDept?DEPT_KEYWORDS[curDept]:null); if(!d)return;
  document.getElementById('tb-cloud').classList.toggle('active',tab==='cloud');
  document.getElementById('tb-rank').classList.toggle('active',tab==='rank');
  const mv=document.getElementById('main-view'), rv=document.getElementById('rank-view');
  if(tab==='cloud'){
    mv.style.display='grid'; rv.style.display='none';
    buildCloud(d);
  } else {
    mv.style.display='none'; rv.style.display='block';
    renderRank(d);
  }
}

function buildCloud(d){
  const mv=document.getElementById('main-view');
  mv.innerHTML=`
    <div class="cloud-wrap" id="cloud-wrap"><svg id="wc-svg"></svg><div class="cloud-hint">🖱 단어 클릭 → 관련 교과목</div></div>
    <div class="detail-panel" id="det-panel"><div style="padding:28px 18px;text-align:center;color:var(--text-dim);font-size:12px;">← 단어를 클릭해 보세요</div></div>`;
  renderCloud(d);
}

function renderCloud(d){
  const wrap=document.getElementById('cloud-wrap'); if(!wrap)return;
  const W=wrap.clientWidth-28, H=wrap.clientHeight-28;
  if(W<100||H<100)return;
  const entries=Object.entries(d.t), maxV=entries[0]?.[1]||1;
  const words=entries.map(([text,score])=>({text,score,size:11+(score/maxV)*54}));
  d3.select('#wc-svg').selectAll('*').remove();
  d3.layout.cloud().size([W,H]).words(words).padding(5)
    .rotate(()=>Math.random()>.75?90:0).fontSize(w=>w.size)
    .on('end',drawn=>drawWords(drawn,W,H,d)).start();
}

function drawWords(words,W,H,deptData){
  const svg=d3.select('#wc-svg').attr('width',W).attr('height',H);
  const g=svg.append('g').attr('transform',`translate(${W/2},${H/2})`);
  g.selectAll('text').data(words).enter().append('text')
    .style('font-family','"Noto Sans KR",sans-serif')
    .style('font-weight',d=>d.size>28?'700':'500')
    .style('fill',(d,i)=>COLORS[i%COLORS.length])
    .style('cursor','pointer').style('opacity',0)
    .attr('text-anchor','middle')
    .attr('transform',d=>`translate(${d.x},${d.y})rotate(${d.rotate})`)
    .attr('font-size',d=>d.size).text(d=>d.text)
    .on('mouseover',function(){d3.select(this).style('opacity',.6).style('text-decoration','underline');})
    .on('mouseout',function(){d3.select(this).style('opacity',1).style('text-decoration','none');})
    .on('click',(e,d)=>showCourses(d.text,deptData))
    .transition().duration(500).delay((d,i)=>i*25).style('opacity',1);
}

function showCourses(kw,deptData){
  const panel=document.getElementById('det-panel'); if(!panel)return;
  const courses=deptData.c?.[kw]||[];
  panel.innerHTML=`
    <div class="det-hdr"><div class="det-kw">${kw}</div><div class="det-sub">${courses.length}개 교과목 매핑</div></div>
    ${courses.length
      ?courses.map(c=>`<div class="course-card"><div class="c-name">📘 ${c.n}</div><div class="c-desc">${c.d}${c.d.length>=80?'…':''}</div></div>`).join('')
      :'<div class="no-courses">저장된 교과목 정보가 없습니다</div>'}`;
}

function renderRank(d){
  const el=document.getElementById('rank-view');
  const items=Object.entries(d.t), max=items[0]?.[1]||1;
  el.innerHTML=`
    <p style="font-size:10px;color:var(--text-dim);font-family:'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;">
      TF-IDF 핵심 키워드 순위 — ${curDept}
    </p>
    ${items.map(([w,s],i)=>{
      const pct=(s/max*100).toFixed(1), c=COLORS[i%COLORS.length];
      return `<div class="rank-item" onclick="switchTab('cloud');setTimeout(()=>showCourses('${w.replace(/'/g,"\\'")}',DEPT_KEYWORDS['${curDept.replace(/'/g,"\\'")}'"]),350)">
        <span class="r-num">${i+1}</span><span class="r-word" style="color:${c}">${w}</span>
        <div class="r-bar-w"><div class="r-bar" style="width:0%;background:${c}" data-p="${pct}"></div></div>
        <span class="r-score">${s.toFixed(3)}</span></div>`;
    }).join('')}`;
  setTimeout(()=>el.querySelectorAll('.r-bar').forEach(b=>b.style.width=b.dataset.p+'%'),60);
}

function toggleCmp(n){
  if(cmpList.includes(n)){cmpList=cmpList.filter(x=>x!==n);}
  else if(cmpList.length<2){cmpList.push(n);}
  else{cmpList=[cmpList[1],n];}
  updateCmpBanner();
  const q=document.getElementById('s-input').value.trim();
  renderList(q?DEPT_LIST_DATA.filter(n=>n.includes(q)):DEPT_LIST_DATA);
}

function updateCmpBanner(){
  const b=document.getElementById('cmp-banner'), tags=document.getElementById('cmp-tags');
  if(!cmpList.length){b.classList.remove('show');return;}
  b.classList.add('show');
  tags.innerHTML=cmpList.map((n,i)=>`${i>0?'<span class="cmp-vs">vs</span>':''}<span class="cmp-tag">${n}</span>`).join('');
}

function clearCompare(){
  cmpList=[]; updateCmpBanner();
  const q=document.getElementById('s-input').value.trim();
  renderList(q?DEPT_LIST_DATA.filter(n=>n.includes(q)):DEPT_LIST_DATA);
}

function openCompare(){
  if(cmpList.length<2){alert('Shift+클릭으로 2개 학과를 선택해주세요');return;}
  const [a,b]=cmpList, da=DEPT_KEYWORDS[a], db=DEPT_KEYWORDS[b];
  const kwA=new Set(Object.keys(da.t)), kwB=new Set(Object.keys(db.t));
  const common=[...kwA].filter(k=>kwB.has(k));
  const onlyA=[...kwA].filter(k=>!kwB.has(k));
  const onlyB=[...kwB].filter(k=>!kwA.has(k));
  document.getElementById('cmp-grid').innerHTML=`
    <div>
      <div class="cmp-col-title" style="color:var(--accent)">${a}</div>
      <div class="sec-label">고유 키워드</div>
      <div>${onlyA.slice(0,12).map(k=>`<span class="kw-chip kw-a">${k}</span>`).join('')}</div>
      <div class="sec-label" style="margin-top:14px">교과목 수</div>
      <div><span class="big-n" style="color:var(--accent)">${da.cnt}</span> <span class="big-u">과목</span></div>
    </div>
    <div>
      <div class="cmp-col-title" style="color:var(--accent3)">${b}</div>
      <div class="sec-label">고유 키워드</div>
      <div>${onlyB.slice(0,12).map(k=>`<span class="kw-chip kw-b">${k}</span>`).join('')}</div>
      <div class="sec-label" style="margin-top:14px">교과목 수</div>
      <div><span class="big-n" style="color:var(--accent3)">${db.cnt}</span> <span class="big-u">과목</span></div>
    </div>`;
  document.getElementById('cmp-common').innerHTML=`
    <div class="sec-label" style="margin-top:18px">공통 키워드 (${common.length}개)</div>
    <div>${common.slice(0,16).map(k=>`<span class="kw-chip kw-c">${k}</span>`).join('')}</div>`;
  document.getElementById('modal-ov').classList.add('show');
}

window.addEventListener('resize',()=>{
  if(curDept&&curTab==='cloud')renderCloud(DEPT_KEYWORDS[curDept]);
});

init();
</script>
</body>
</html>
